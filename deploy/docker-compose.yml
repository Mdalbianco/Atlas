# Avvio: docker compose -f deploy/docker-compose.yml up -d --build
services:
  atlas:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${ATLAS_BASE_IMAGE:-python:3.12-slim}
    container_name: atlas
    restart: unless-stopped          # riavvio automatico dopo crash o reboot del server
    stop_grace_period: 90s           # tempo per terminare il ciclo in corso
    env_file: ../.env          # segreti solo qui (file escluso da Git)
    environment:
      ATLAS_MODE: paper        # forzato: il trading reale non è attivabile
      ATLAS_DATA_DIR: /app/data
    volumes:
      - atlas-data:/app/data   # database SQLite persistente tra riavvii
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  atlas-data:
